[workspace]
preview = ["pixi-build"]
authors = ["Mehmet Keçeci <enfo@tuta.io>"]
channels = ["pypi", "https://prefix.dev/conda-forge", "https://conda.modular.com/max-nightly", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64"]
name = "ezan"
version = "0.1.2"

[package]
name = "ezan"
version = "0.1.2"
license = "AGPL-3.0-or-later"

[dependencies]
python = ">=3.11"
pip = ">=25.3"
conda-build = ">=25.11.1"
setuptools = ">=80.10.1"
wheel = ">=0.45.1"
hatchling = ">=1.28.0"
setuptools_scm = ">=9.2.2"
rattler-build = ">=0.55.0"
pytest = "*"

[tasks]
build = "python -m build"
start = "python -c 'import ezan; print(ezan.__version__)'"
lint = "ruff check ."
fmt = "ruff format ."
serve = { cmd = "python -m http.server", cwd = "docs" }
install-ezan = "pip install git+https://github.com/WhiteSymmetry/ezan"
install = "pip install -e ."
test = { depends-on = ["install"], cmd = "pytest" }
install-deps = "pip install ezan"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
hatchling = "*"
